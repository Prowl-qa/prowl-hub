# Browse Page — Search and Category Filtering
# Verifies the browse page loads, search filters results, and category chips work.

name: browse-and-filter
description: Test the browse page search input and category filter chips
tags:
  - browse
  - search
  - filtering

steps:
  - navigate: "/browse"

  - waitForNetworkIdle:
      timeout: 5000

  # Search input is present
  - waitForSelector:
      selector: "#browse-search"

  # Category chips are visible
  - waitForSelector:
      selector: "[role='list'][aria-label='Categories']"

  # Results count shows
  - waitForSelector:
      selector: ".results-count"

  # Hunt cards render
  - waitForSelector:
      selector: ".hunt-card"

  # Search for "auth" — should filter results
  - fill:
      selector: "#browse-search"
      value: "auth"

  - wait:
      for: "Auth"
      timeout: 3000

  # Clear search and filter by category
  - fill:
      selector: "#browse-search"
      value: ""

  - click: "Auth"

  - waitForUrl:
      value: "category=auth"
      timeout: 3000

  # Switch to "All" to reset
  - click: "All"

assertions:
  - noConsoleErrors: true
  - urlIncludes: "/browse"
