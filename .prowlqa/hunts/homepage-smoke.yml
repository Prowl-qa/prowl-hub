# Homepage Smoke Test
# Verifies the landing page loads with all key sections visible.

name: homepage-smoke
description: Verify the hub landing page loads with hero, metrics, featured hunts, and quality sections
tags:
  - smoke
  - homepage

steps:
  - navigate: "/"

  - waitForNetworkIdle:
      timeout: 5000

  # Hero section
  - wait: "Find and share reusable hunts for real product flows."

  - assert:
      visible: "Explore verified hunts"

  - assert:
      visible: "Submit through PR"

  # Metrics section
  - waitForSelector:
      selector: "section[aria-label='Catalog statistics']"

  - wait: "Verified hunts"
  - wait: "Categories covered"

  # Featured section
  - wait: "Curated community hunts"

  - waitForSelector:
      selector: ".featured-grid .hunt-card"

  # Quality section
  - wait: "Verified-only publishing"
  - wait: "Security review"
  - wait: "Structured moderation"

assertions:
  - noConsoleErrors: true
  - urlEquals: "/"
